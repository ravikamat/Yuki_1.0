; TTS Paths Configuration
; All paths are relative to the executable directory

[Kokoro]
runner_bat = data\kokoro\kokoro_runner.bat
exe = data\kokoro\kokoro.exe
input_txt = data\tts\kokoro_input.txt

[Piper]
exe_paths = third_party\piper\piper.exe, tools\piper\piper.exe, bin\piper\piper.exe, data\tts\piper.exe
input_txt = data\tts\piper_input.txt

[PiperModels]
; Each line: model_name = model_path
; JSON config file must exist at model_path + ".json"
en_US-lessac-medium = data\voices\piper\en_US-lessac-medium.onnx
en_US-amy-medium = data\voices\piper\en_US-amy-medium.onnx
en_GB-alan-medium = data\voices\piper\en_GB-alan-medium.onnx
en_US-lessac-medium_legacy = data\tts\en_US-lessac-medium.onnx

[EdgeTTS]
speak_py = data\tts\yuki_edge_speak.py
daemon_py = data\tts\yuki_tts_daemon.py

[Common]
tts_output_dir = data\tts