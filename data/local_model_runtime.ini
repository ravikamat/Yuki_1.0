[oneapi]
enabled=true
runtime_mode=external_llama_server
oneapi_environment_script=C:/Program Files (x86)/Intel/oneAPI/setvars.bat
sycl_runtime_probe=sycl-ls.exe

[llama_cpp]
server_executable=D:/YukiDeps/llama.cpp/build-sycl/bin/Release/llama-server.exe
bench_executable=D:/YukiDeps/llama.cpp/build-sycl/bin/Release/llama-bench.exe
model_path=D:/YukiModels/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
host=127.0.0.1
port=18080
context_size=4096
gpu_layers=-1
parallel_slots=1
startup_timeout_ms=30000
request_timeout_ms=120000
health_timeout_ms=3000

[cpu_fallback]
enabled=true
threads=0
context_size=2048

[resource_policy]
foreground_cpu_reserve_logical_cores=2
minimum_available_ram_mb=8192
minimum_available_ram_mb_for_gpu_model=10240
maximum_background_cpu_percent=55
maximum_background_ram_percent=35
maximum_background_gpu_percent=70
idle_seconds_before_background_work=600

[model_policy]
require_sycl_benchmark=true
minimum_decode_tokens_per_second=4.0
maximum_health_latency_ms=3000
maximum_model_ram_mb=8192
allow_cpu_local_fallback=true
allow_external_fallback=true
